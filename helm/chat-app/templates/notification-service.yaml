apiVersion: v1
kind: Service
metadata:
  name: {{ include "chat-app.fullname" . }}-notification
  labels:
    {{- include "chat-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification
spec:
  type: {{ .Values.notification.service.type }}
  ports:
    - port: {{ .Values.notification.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chat-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notification
